<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SculptX Admin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }
    .header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }
    .header p {
      opacity: 0.9;
      font-size: 14px;
    }
    .content {
      padding: 30px;
    }
    .section {
      margin-bottom: 40px;
    }
    .section h2 {
      font-size: 18px;
      color: #333;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid #eee;
    }
    .login-form {
      display: grid;
      gap: 15px;
      max-width: 400px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .form-group label {
      font-weight: 600;
      color: #333;
      font-size: 14px;
    }
    .form-group input {
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
    }
    .form-group input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    button {
      padding: 12px 24px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s ease;
    }
    button:hover {
      background: #764ba2;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }
    .hidden { display: none; }
    .admin-panel {
      display: grid;
      gap: 25px;
    }
    .generate-box {
      background: #f8f9ff;
      padding: 20px;
      border-radius: 12px;
      border: 2px solid #e8ebff;
    }
    .generate-box .form-group {
      margin-bottom: 12px;
    }
    .generate-box .form-group:last-child {
      margin-bottom: 0;
    }
    .codes-list {
      background: #f8f9ff;
      padding: 20px;
      border-radius: 12px;
      border: 2px solid #e8ebff;
      max-height: 500px;
      overflow-y: auto;
    }
    .code-item {
      background: white;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 4px solid #667eea;
    }
    .code-item.usado {
      opacity: 0.6;
      border-left-color: #999;
    }
    .code-item .info {
      flex: 1;
    }
    .code-item .codigo {
      font-weight: 700;
      font-size: 16px;
      font-family: 'Courier New', monospace;
      color: #333;
      margin-bottom: 4px;
    }
    .code-item .meta {
      font-size: 12px;
      color: #999;
    }
    .code-item .status {
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      margin-left: 10px;
    }
    .code-item .status.ativo {
      background: #e8f8ff;
      color: #0066cc;
    }
    .code-item .status.usado {
      background: #ffe8e8;
      color: #cc0000;
    }
    .message {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 14px;
      animation: slideIn 0.3s ease;
    }
    .message.success {
      background: #e8f8f5;
      color: #1a7a66;
      border-left: 4px solid #1a7a66;
    }
    .message.error {
      background: #ffe8e8;
      color: #cc0000;
      border-left: 4px solid #cc0000;
    }
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }
    .stat-box {
      background: white;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #eee;
      text-align: center;
    }
    .stat-box .number {
      font-size: 24px;
      font-weight: 700;
      color: #667eea;
    }
    .stat-box .label {
      font-size: 12px;
      color: #999;
      margin-top: 4px;
    }
    .logout-btn {
      background: #ff6b6b;
      margin-top: 20px;
    }
    .logout-btn:hover {
      background: #ff5252;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎯 Método SculptX</h1>
      <p>Painel Administrativo de Códigos</p>
    </div>

    <div class="content">
      <!-- LOGIN -->
      <div id="loginSection" class="section">
        <h2>Fazer Login</h2>
        <div class="login-form">
          <div class="form-group">
            <label for="senha">Senha Admin:</label>
            <input type="password" id="senha" placeholder="Digite sua senha">
          </div>
          <button onclick="handleLogin()">Entrar</button>
        </div>
      </div>

      <!-- ADMIN PANEL -->
      <div id="adminSection" class="admin-panel hidden">
        <div id="message"></div>

        <div class="section">
          <h2>📊 Estatísticas</h2>
          <div class="stats">
            <div class="stat-box">
              <div class="number" id="totalCodes">0</div>
              <div class="label">Total de Códigos</div>
            </div>
            <div class="stat-box">
              <div class="number" id="activeCodes">0</div>
              <div class="label">Códigos Ativos</div>
            </div>
            <div class="stat-box">
              <div class="number" id="usedCodes">0</div>
              <div class="label">Códigos Usados</div>
            </div>
          </div>
        </div>

        <div class="section">
          <h2>✨ Gerar Novo Código</h2>
          <div class="generate-box">
            <div class="form-group">
              <label for="buyerName">Nome do Comprador (opcional):</label>
              <input type="text" id="buyerName" placeholder="Ex: João Silva">
            </div>
            <div class="form-group">
              <label for="buyerEmail">Email (opcional):</label>
              <input type="email" id="buyerEmail" placeholder="Ex: joao@email.com">
            </div>
            <button onclick="generateCode()">Gerar Código</button>
          </div>
        </div>

        <div class="section">
          <h2>📋 Códigos Gerados</h2>
          <button onclick="loadCodes()">🔄 Atualizar Lista</button>
          <div class="codes-list" id="codesList">
            <p style="color: #999; text-align: center;">Carregando...</p>
          </div>
        </div>

        <button class="logout-btn" onclick="handleLogout()">Sair da Conta</button>
      </div>
    </div>
  </div>

  <script>
    let adminPassword = null;

    function handleLogin() {
      const senha = document.getElementById('senha').value;
      if (!senha) {
        showMessage('Digite a senha!', 'error');
        return;
      }
      adminPassword = senha;
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('adminSection').classList.remove('hidden');
      loadCodes();
    }

    function handleLogout() {
      adminPassword = null;
      document.getElementById('adminSection').classList.add('hidden');
      document.getElementById('loginSection').classList.remove('hidden');
      document.getElementById('senha').value = '';
      showMessage('');
    }

    async function generateCode() {
      const buyerName = document.getElementById('buyerName').value;
      const email = document.getElementById('buyerEmail').value;

      if (!adminPassword) {
        showMessage('Não autenticado!', 'error');
        return;
      }

      try {
        const res = await fetch('/api/generate-code', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': adminPassword
          },
          body: JSON.stringify({ buyerName, email })
        });

        const data = await res.json();

        if (data.ok) {
          showMessage(`✅ Código gerado: <strong>${data.codigo}</strong>`, 'success');
          document.getElementById('buyerName').value = '';
          document.getElementById('buyerEmail').value = '';
          loadCodes();
        } else {
          showMessage(`❌ Erro: ${data.reason}`, 'error');
        }
      } catch (err) {
        showMessage(`❌ Erro na requisição: ${err.message}`, 'error');
      }
    }

    async function loadCodes() {
      if (!adminPassword) return;

      try {
        const res = await fetch('/api/list-codes', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': adminPassword
          }
        });

        const data = await res.json();

        if (data.ok) {
          const codes = data.codes;
          const total = codes.length;
          const usado = codes.filter(c => c.usado).length;
          const ativo = total - usado;

          document.getElementById('totalCodes').textContent = total;
          document.getElementById('activeCodes').textContent = ativo;
          document.getElementById('usedCodes').textContent = usado;

          const html = codes.length ? codes.map(c => `
            <div class="code-item ${c.usado ? 'usado' : ''}">
              <div class="info">
                <div class="codigo">${c.codigo}</div>
                <div class="meta">
                  Criado: ${new Date(c.criado_em).toLocaleString('pt-BR')}
                  ${c.nome_comprador ? ` · ${c.nome_comprador}` : ''}
                  ${c.usado_em ? ` · Usado: ${new Date(c.usado_em).toLocaleString('pt-BR')}` : ''}
                </div>
              </div>
              <div class="status ${c.usado ? 'usado' : 'ativo'}">
                ${c.usado ? '✓ USADO' : '● ATIVO'}
              </div>
            </div>
          `).join('') : '<p style="color: #999; text-align: center;">Nenhum código gerado.</p>';

          document.getElementById('codesList').innerHTML = html;
        } else {
          showMessage(`❌ Erro ao carregar: ${data.reason}`, 'error');
        }
      } catch (err) {
        showMessage(`❌ Erro: ${err.message}`, 'error');
      }
    }

    function showMessage(msg, type = 'success') {
      const msgDiv = document.getElementById('message');
      if (!msg) {
        msgDiv.innerHTML = '';
        return;
      }
      msgDiv.innerHTML = `<div class="message ${type}">${msg}</div>`;
      if (type === 'success') {
        setTimeout(() => msgDiv.innerHTML = '', 5000);
      }
    }
  </script>
</body>
</html>
