<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Método SculptX</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600;700;800&display=swap');

:root{
  --bg:#070d0b;
  --bg-1:#0e1c18;
  --line:rgba(237,238,233,0.10);
  --line-bright:rgba(159,190,175,0.22);
  --emerald:#3E8F65;
  --emerald-bright:#5FBE8B;
  --emerald-glow:#4ADE80;
  --ink:#EDEEE9;
  --ink-dim:#9BA79F;
  --ink-faint:#5E6864;
  --amber:#D8B45C;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:var(--bg);
  color:var(--ink-dim);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  -webkit-font-smoothing:antialiased;
}
.serif{font-family:'Fraunces',serif;}

header{padding:20px 22px 0; display:flex; flex-direction:column; gap:16px;}
.back-row{display:flex; align-items:center;}
.back-btn{
  width:36px; height:36px; border-radius:50%; border:1px solid var(--line-bright);
  background:none; color:var(--ink-dim); display:flex; align-items:center; justify-content:center;
  cursor:pointer; font-size:16px; visibility:hidden;
}
.back-btn.show{visibility:visible;}
.brand{display:flex; align-items:center; justify-content:center; gap:10px;}
.brand img{width:26px; height:26px;}
.brand span{font-size:12.5px; letter-spacing:2px; color:var(--ink); text-transform:uppercase; font-weight:600;}
.progress-track{height:3px; background:var(--line); border-radius:2px; overflow:hidden;}
.progress-fill{height:100%; background:var(--emerald-bright); border-radius:2px; transition:width .4s ease;}

main{flex:1; padding:30px 24px 150px; max-width:560px; margin:0 auto; width:100%;}

.eyebrow{font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--emerald-bright); margin-bottom:14px; font-weight:600;}
.q-title{font-family:'Fraunces',serif; font-weight:500; font-size:25px; color:var(--ink); line-height:1.32; margin-bottom:18px;}

.info-box{
  border:1px solid var(--line-bright); background:var(--bg-1); border-radius:14px;
  padding:16px 18px; font-size:13.5px; line-height:1.65; color:var(--ink-dim); margin-bottom:26px;
}
.info-box b{color:var(--emerald-bright); font-weight:700;}

.why-box{
  border:1px solid rgba(216,180,92,0.25); background:rgba(216,180,92,0.05); border-radius:14px;
  padding:16px 18px; margin-top:24px;
}
.why-box .wt{font-size:10.5px; letter-spacing:2px; text-transform:uppercase; color:var(--amber); font-weight:700; margin-bottom:8px;}
.why-box p{font-size:12.5px; line-height:1.6; color:var(--ink-dim);}

.opt-list{display:flex; flex-direction:column; gap:11px;}
.opt-grid2{display:grid; grid-template-columns:1fr 1fr; gap:11px;}
.row-card{
  border:1px solid var(--line-bright); border-radius:14px; background:var(--bg-1);
  padding:15px 18px; cursor:pointer; transition:all .2s ease;
}
.row-card:active{transform:scale(0.98);}
.row-card.selected{border-color:var(--emerald-bright); box-shadow:0 0 0 1.5px var(--emerald-bright);}
.row-card .rt{color:var(--ink); font-weight:600; font-size:15px; display:flex; justify-content:space-between; align-items:center; gap:10px;}
.row-card .rs{color:var(--ink-faint); font-size:12px; margin-top:4px;}
.row-card .kcal-tag{font-family:'Fraunces',serif; font-style:italic; color:var(--emerald-bright); font-size:14px; white-space:nowrap;}
.row-card .check{
  width:20px; height:20px; border-radius:6px; border:1.5px solid var(--ink-faint);
  display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--bg); flex-shrink:0;
}
.row-card.selected .check{background:var(--emerald-bright); border-color:var(--emerald-bright);}
.row-card.multi{display:flex; align-items:center; justify-content:space-between; gap:12px;}
.row-card.multi .emoji{font-size:22px; margin-right:10px;}
.row-card.multi .rt{font-size:14.5px; flex:1;}

.badge{
  display:inline-block; background:var(--emerald-bright); color:var(--bg); font-weight:700;
  font-size:10px; letter-spacing:1px; text-transform:uppercase; padding:5px 10px; border-radius:6px; margin-bottom:10px;
}
.rec-card{border-color:var(--emerald-bright); box-shadow:0 0 0 1.5px var(--emerald-bright); background:linear-gradient(160deg, rgba(74,222,128,0.06), var(--bg-1));}
.rec-card .rt{font-family:'Fraunces',serif; font-size:19px; font-weight:500;}

input[type="text"], input[type="number"], input[type="tel"]{
  width:100%; padding:16px 18px; border-radius:14px; border:1px solid var(--line-bright);
  background:var(--bg-1); color:var(--ink); font-size:17px; font-family:'Inter',sans-serif;
}
input:focus{outline:none; border-color:var(--emerald-bright);}
input::placeholder{color:var(--ink-faint);}

.footer-btn{
  position:fixed; bottom:0; left:0; right:0; padding:18px 22px 28px;
  background:linear-gradient(to top, var(--bg) 65%, transparent);
}
.continue-btn{
  max-width:512px; margin:0 auto; display:block; width:100%;
  background:var(--emerald-bright); color:var(--bg); border:none; border-radius:14px;
  padding:17px; font-size:15px; font-weight:700; cursor:pointer; transition:all .2s ease;
  font-family:'Inter',sans-serif; letter-spacing:0.2px;
}
.continue-btn:disabled{background:var(--line-bright); color:var(--ink-faint); cursor:not-allowed;}
.continue-btn:not(:disabled):active{transform:scale(0.98);}

/* break screens */
.break-wrap{padding-top:6px;}
.break-tag{
  display:inline-block; font-size:10.5px; letter-spacing:2px; text-transform:uppercase; color:var(--amber);
  border:1px solid rgba(216,180,92,0.3); padding:6px 12px; border-radius:8px; margin-bottom:20px;
}
.break-wrap h2{font-family:'Fraunces',serif; font-weight:500; font-size:24px; color:var(--ink); line-height:1.35; margin-bottom:18px;}
.break-wrap h2 em{color:var(--emerald-bright); font-style:italic;}
.break-wrap p{font-size:14.5px; line-height:1.75; color:var(--ink-dim);}
.break-wrap p b{color:var(--ink); font-weight:700;}

/* final */
.final-wrap{text-align:center; padding-top:6px;}
.final-badge{
  width:58px; height:58px; border-radius:50%; background:rgba(74,222,128,0.1); border:1px solid var(--emerald-bright);
  display:flex; align-items:center; justify-content:center; margin:0 auto 20px; font-size:24px; color:var(--emerald-bright);
}
.final-wrap h2{font-family:'Fraunces',serif; font-size:23px; color:var(--ink); font-weight:500; margin-bottom:12px;}
.final-wrap>p{font-size:14px; color:var(--ink-dim); line-height:1.65; margin-bottom:8px;}

.summary-card{
  margin-top:26px; text-align:left; border:1px solid var(--line-bright); border-radius:16px; background:var(--bg-1);
  padding:22px 22px 8px;
}
.summary-sec{margin-bottom:18px;}
.summary-sec .st{font-size:10.5px; letter-spacing:2px; text-transform:uppercase; color:var(--emerald-bright); font-weight:700; margin-bottom:10px;}
.srow{display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px;}
.srow:last-child{border-bottom:none;}
.srow .k{color:var(--ink-faint);}
.srow .v{color:var(--ink); font-weight:600; text-align:right;}
.big-num{text-align:center; padding:18px 0 22px;}
.big-num .n{font-family:'Fraunces',serif; font-size:46px; color:var(--emerald-bright); font-weight:500;}
.big-num .u{font-size:13px; color:var(--ink-faint); margin-top:2px;}

.wa-btn{
  display:flex; align-items:center; justify-content:center; gap:10px;
  background:var(--emerald-bright); color:var(--bg); text-decoration:none; border-radius:14px;
  padding:18px; font-weight:700; font-size:15px; margin-top:26px;
  border:none; cursor:pointer; width:100%; font-family:'Inter',sans-serif;
}
.wa-btn svg{width:19px; height:19px;}

@media(min-width:600px){ main{padding-top:44px;} }

/* ===== INTRO HERO ===== */
.intro-hero{
  position:relative; width:100%;
}
.intro-photo{position:absolute; inset:0; overflow:hidden; z-index:0;}
.intro-photo img{width:100%; height:100%; object-fit:cover; object-position:center 20%; filter:grayscale(100%) contrast(1.15) brightness(0.65); display:block;}
.intro-photo::after{
  content:''; position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(7,13,11,0.55) 0%, rgba(7,13,11,0.72) 45%, rgba(7,13,11,0.92) 80%, var(--bg) 100%);
}
.intro-content{position:relative; z-index:2; padding:44px 24px 40px; width:100%; box-sizing:border-box;}
.intro-kicker{font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--emerald-bright); font-weight:700; margin-bottom:16px;}
.intro-content h1{font-family:'Fraunces',serif; font-weight:500; font-size:clamp(26px,7vw,36px); line-height:1.22; color:var(--ink); margin-bottom:16px;}
.intro-content h1 em{color:var(--emerald-bright); font-style:italic;}
.intro-content > p{font-size:14.5px; line-height:1.7; color:var(--ink-dim); margin-bottom:26px;}
.intro-features{display:flex; flex-direction:column; gap:11px; margin-bottom:30px;}
.intro-features div{font-size:13.5px; color:var(--ink); display:flex; align-items:center; gap:10px;}
.intro-features div::before{content:'✓'; color:var(--emerald-bright); font-weight:700; flex-shrink:0;}
.intro-cta{width:100%; max-width:512px;}
</style>
</head>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<body>
<!-- Formulário de Código -->
<div id="codeForm" class="code-form-container">
  <div class="code-form">
    <h2>Digite seu Código de Acesso</h2>
    <input type="text" id="codeInput" placeholder="Ex: HZN7ME" maxlength="6">
    <button onclick="checkCode()">Entrar</button>
    <div id="errorMessage"></div>
  </div>
</div>

<script>
async function checkCode() {
  const code = document.getElementById('codeInput').value.toUpperCase();
  const errorDiv = document.getElementById('errorMessage');
  
  if (!code) {
    errorDiv.textContent = 'Digite o código!';
    return;
  }
  
  try {
    const response = await fetch('/api/check-code', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ codigo: code })
    });
    
    const data = await response.json();
    
    if (data.ok) {
      document.getElementById('codeForm').style.display = 'none';
      document.querySelector('.intro').style.display = 'block';
      await fetch('/api/use-code', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ codigo: code }) });

    } else {
      errorDiv.textContent = 'Código inválido ou já utilizado!';
    }
  } catch (err) {
    errorDiv.textContent = 'Erro ao validar.';
  }
}
</script>

<style>
.code-form-container { display:flex; justify-content:center; align-items:center; min-height:100vh; background:var(--bg); }
.code-form { background:white; padding:40px; border-radius:12px; text-align:center; max-width:400px; }
.code-form h2 { color:var(--emerald); margin-bottom:20px; }
.code-form input { width:100%; padding:12px; margin-bottom:15px; border:2px solid var(--emerald); border-radius:8px; font-size:16px; text-transform:uppercase; }
.code-form button { width:100%; padding:12px; background:var(--emerald); color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer; }
#errorMessage { color:#e74c3c; margin-top:10px; }
</style>

// ==================== CALCULATION ENGINE ====================
const ACTIVITY = {
  'Sedentário': {mult:1.2, desc:'trabalho sentado, quase não anda'},
  'Leve': {mult:1.375, desc:'anda um pouco todo dia'},
  'Moderado': {mult:1.55, desc:'movimento constante ou treino regular'},
  'Intenso': {mult:1.725, desc:'trabalho físico ou treino pesado'},
  'Muito intenso': {mult:1.9, desc:'físico o dia todo + treino'},
};
const GOAL_ADJ = {
  'Secar gordura': 0.80,
  'Ganhar massa muscular': 1.12,
  'Secar e ganhar ao mesmo tempo': 0.97,
};

function calcBMR(a){
  const base = 10*a.peso + 6.25*a.altura - 5*a.idade;
  return a.sexo === 'Masculino' ? base + 5 : base - 161;
}
function calcTDEE(a){ return calcBMR(a) * ACTIVITY[a.rotina].mult; }
function calcTarget(a){ return calcTDEE(a) * GOAL_ADJ[a.objetivo]; }
function calcMacros(a){
  const target = calcTarget(a);
  let proteinG, carbG, fatG;
  
  if(a.objetivo === 'Ganho de Massa'){
    // Proteína MODERADA + Carboidrato ALTO
    proteinG = Math.round(a.peso * 1.7);  // 1.7g/kg
    fatG = Math.round((target * 0.20) / 9);  // 20% das calorias
    const carbKcal = target - (proteinG * 4) - (fatG * 9);
    carbG = Math.round(carbKcal / 4);
  } else if(a.objetivo === 'Perda de Peso'){
    // Proteína ALTA + Carboidrato BAIXO
    proteinG = Math.round(a.peso * 2.2);  // 2.2g/kg
    fatG = Math.round((target * 0.22) / 9);  // 22% das calorias
    const carbKcal = target - (proteinG * 4) - (fatG * 9);
    carbG = Math.round(carbKcal / 4);
  } else {
    // Definição: Ambos MODERADOS
    proteinG = Math.round(a.peso * 2.0);  // 2.0g/kg
    fatG = Math.round((target * 0.25) / 9);  // 25% das calorias
    const carbKcal = target - (proteinG * 4) - (fatG * 9);
    carbG = Math.round(carbKcal / 4);
  }
  
  return {proteinG, fatG, carbG};
}
function recommendSplit(a){
  const dias = parseInt(a.dias, 10);
  if(dias <= 3) return 'Full Body';
  if(dias === 4) return 'Upper / Lower (2x cada)';
  if(dias === 5) return a.nivel === 'Avançado' ? 'Push / Pull / Legs + Upper/Lower' : 'Upper / Lower + Full Body';
  return 'Push / Pull / Legs (2x na semana)';
}

  2: [
    {v:'Full Body', sub:'Corpo inteiro em cada sessão — ideal pra frequência baixa', for:['Iniciante','Intermediário']},

    {v:'A / B / C / D / E / F', sub:'Um grupo por dia, volume máximo', for:['Avançado']},
    {v:'Push / Pull / Legs + Foco Extra', sub:'PPL padrão com um dia focado no seu ponto fraco', for:['Intermediário','Avançado']},
  ],
};
function getSplitOptions(a){
  const dias = parseInt(a.dias, 10);
  const dayKey = dias<=2 ? 2 : (dias>=6 ? 6 : dias);
  const base = SPLIT_TABLE[dayKey];
  let flagged = false;
  return base.map(o=>{
    const isRec = !flagged && o.for.includes(a.nivel);
    if(isRec) flagged = true;
    return {v:o.v, sub:o.sub, recommended:isRec};
  }).map((o,i,arr)=>{
    if(!flagged && i===0) return {...o, recommended:true};
    return o;
  });
}

const EX_COUNT_BY_TIME = {'20 min':3,'30 min':4,'45 min':5,'60 min':6,'75 min':7,'90 min':8};

function getScheme(nivel, objetivo){
  if(nivel === 'Iniciante') return {series:3, reps:'12 a 15', descanso:'60s', metodo:'Execução controlada, foco em aprender o movimento'};
  if(nivel === 'Intermediário'){
    if(objetivo === 'Ganhar massa muscular') return {series:4, reps:'8 a 12', descanso:'60s', metodo:'Carga progressiva; bi-set na última série do último exercício'};
    return {series:4, reps:'12 a 15', descanso:'45s', metodo:'Ritmo mais intenso, descanso curto entre séries'};
  }
  // Avançado
  if(objetivo === 'Ganhar massa muscular') return {series:5, reps:'6 a 10', descanso:'75s', metodo:'Carga alta; drop-set no último exercício de cada grupo'};
  return {series:4, reps:'10 a 15', descanso:'40s', metodo:'Rest-pause e bi-sets para intensificar sem aumentar o tempo'};
}

function getCardioPlan(a){
  const nivel = a.nivel;
  const local = a.local || 'Academia';
  let duracao, ritmo, frequencia, quando, tipo;
  
  // Define tipo de cardio baseado no local
  if(local === 'Casa'){
    tipo = 'Caminhada na rua ou corrida leve';
  } else {
    tipo = Math.random() > 0.5 ? 'Esteira' : 'Bicicleta Ergométrica';
  }
  
  if(a.objetivo === 'Secar gordura'){
    duracao = nivel==='Iniciante' ? 20 : (nivel==='Avançado' ? 30 : 25);
    ritmo = tipo === 'Caminhada na rua ou corrida leve' 
      ? 'Moderado — alterne caminhada rápida com trote leve'
      : 'Moderado — alterne intensidade a cada 2 minutos';
    frequencia = `${Math.min(5, (parseInt(a.dias,10)||3)+1)}x por semana`;
    quando = 'De preferência após o treino de musculação, ou em jejum pela manhã';
  } else if(a.objetivo === 'Ganhar massa muscular'){
    duracao = nivel==='Iniciante' ? 10 : (nivel==='Avançado' ? 15 : 12);
    ritmo = tipo === 'Caminhada na rua ou corrida leve'
      ? 'Leve — caminhada, sem perder o fôlego pra conversar'
      : 'Leve — resistência baixa, ritmo constante';
    frequencia = '2x por semana';
    quando = 'Em dias separados do treino de força, pra não atrapalhar a recuperação';
  } else {
    duracao = nivel==='Iniciante' ? 15 : (nivel==='Avançado' ? 22 : 18);
    ritmo = tipo === 'Caminhada na rua ou corrida leve'
      ? 'Moderado — caminhada ou trote leve constante'
      : 'Moderado — resistência média, ritmo constante';
    frequencia = '3x por semana';
    quando = 'Após o treino de musculação';
  }
  return {
    tipo,
    duracao: `${duracao} minutos`,
    ritmo, frequencia, quando,
  };
}

function generateWorkoutPlan(answers){
  const diasNum = parseInt(answers.dias, 10) || 3;
  const structure = (answers.sexo === 'Feminino')
    ? (FEMALE_DAY_PATTERNS[diasNum] || FEMALE_DAY_PATTERNS[3])
    : (DIVISION_STRUCTURE[answers.divisao] || DIVISION_STRUCTURE['Full Body']);
  const local = answers.local === 'Em casa' ? 'Casa' : 'Academia';
  const nEx = EX_COUNT_BY_TIME[answers.tempo] || 5;
  const scheme = getScheme(answers.nivel, answers.objetivo);
  const focoGroup = mapFocoToGroup(answers.foco);
  const estilo = answers.estilo || 'Musculação';
  let rotTrad = {}, rotFunc = {}, rotPick = {};

  function pickExercise(g){
    const tradPool = (EXERCISES[g] && EXERCISES[g][local]) || [];
    const funcPool = (FUNCTIONAL_EXERCISES[g] && FUNCTIONAL_EXERCISES[g][local]) || [];
    if(estilo === 'Funcional'){
      const pool = funcPool.length ? funcPool : tradPool;
      if(!pool.length) return null;
      if(!rotFunc[g]) rotFunc[g] = 0;
      const ex = pool[rotFunc[g] % pool.length]; rotFunc[g]++;
      return ex;
    }
    if(estilo === 'Misto'){
      if(!rotPick[g]) rotPick[g] = 0;
      const useFunc = (rotPick[g] % 2 === 1) && funcPool.length;
      rotPick[g]++;
      if(useFunc){
        if(!rotFunc[g]) rotFunc[g] = 0;
        const ex = funcPool[rotFunc[g] % funcPool.length]; rotFunc[g]++;
        return ex;
      } else {
        if(!rotTrad[g]) rotTrad[g] = 0;
        const pool = tradPool.length ? tradPool : funcPool;
        if(!pool.length) return null;
        const ex = pool[rotTrad[g] % pool.length]; rotTrad[g]++;
        return ex;
      }
    }
    // Musculação (default)
    const pool = tradPool.length ? tradPool : funcPool;
    if(!pool.length) return null;
    if(!rotTrad[g]) rotTrad[g] = 0;
    const ex = pool[rotTrad[g] % pool.length]; rotTrad[g]++;
    return ex;
  }

  // Spread the extra focus across alternating days (never two days in a row) instead of just the last day
  const focusDayIndices = [];
  for(let i=0; i<diasNum; i+=2) focusDayIndices.push(i);

  const days = [];
  for(let i=0; i<diasNum; i++){
    const dayStr = structure[i % structure.length];
    const label = dayStr.includes(':') ? dayStr.split(':')[0].trim() : `Dia ${i+1}`;
    const groupsRaw = dayStr.includes(':') ? dayStr.split(':')[1] : dayStr;
    let groups = groupsRaw.split(',').map(s=>s.trim());
    groups = groups.flatMap(g=> g.includes('/') ? g.split('/').map(x=>x.trim()) : [g]);
    const isFocusDay = focoGroup && focusDayIndices.includes(i);

    let exercises = [];
    let perGroup = Math.max(1, Math.floor(nEx / groups.length));
    let remainder = nEx - perGroup*groups.length;
    groups.forEach((g, gi)=>{
      let count = perGroup + (gi < remainder ? 1 : 0);
      for(let k=0;k<count;k++){
        const ex = pickExercise(g);
        if(ex) exercises.push({exercicio: ex, grupo:g});
      }
    });
    if(isFocusDay && focoGroup){
      const ex = pickExercise(focoGroup);
      if(ex) exercises.push({exercicio: ex + ' (foco extra)', grupo:focoGroup});
    }
    applyMethods(exercises, answers.nivel, i);
    days.push({label: `Dia ${i+1} — ${label}`, groups, exercises});
  }

  return {days, scheme};
}

// Advanced intensity techniques — applied to 1-2 exercises per day, only for Intermediário/Avançado
const METHOD_LIBRARY = [
  {nome:'Drop-set', explica:'reduz o peso e continua a série sem descanso, até quase a falha'},
  {nome:'Rest-pause', explica:'descansa 15 a 20s no meio da série e continua até a falha'},
  {nome:'Bi-set', explica:'faz esse exercício e o seguinte em sequência, sem descanso entre eles'},
  {nome:'Cluster set', explica:'divide a série em blocos pequenos, com 10 a 15s de descanso entre eles'},
  {nome:'Método 6-12-25', explica:'três blocos na mesma série — 6, 12 e 25 repetições — reduzindo o peso a cada bloco'},
  {nome:'Excêntrica lenta', explica:'desce o peso bem devagar (3 a 4s) pra aumentar o tempo sob tensão'},
  {nome:'Pico de contração', explica:'segura 1 a 2s no ponto de maior contração do músculo'},
];
function applyMethods(exercises, nivel, dayIndex){
  if(nivel !== 'Intermediário' && nivel !== 'Avançado') return;
  const validIdx = exercises.map((e,i)=>i).filter(i=> !exercises[i].exercicio.includes('(foco extra)'));
  if(!validIdx.length) return;
  const count = nivel === 'Avançado' ? Math.min(2, validIdx.length) : 1;
  const targets = count === 2 ? [validIdx[0], validIdx[validIdx.length-1]] : [validIdx[validIdx.length-1]];
  [...new Set(targets)].forEach((idx, i)=>{
    const method = METHOD_LIBRARY[(dayIndex*2 + i) % METHOD_LIBRARY.length];
    exercises[idx].metodo = method;
  });
}

function mapFocoToGroup(foco){
  const map = {
    'Peito':'Peito','Costas':'Costas','Ombros':'Ombros','Bíceps':'Bíceps','Tríceps':'Tríceps',
    'Quadríceps':'Pernas','Posterior de coxa':'Pernas','Glúteos':'Pernas','Panturrilhas':'Panturrilha','Abdômen':'Abdômen',
  };
  return map[foco] || null;
}

function generatePDF(a){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:'a4'});
  const pageW = 210, marginX = 18, pageBottom = 278;
  let y = 24;

  // Dark, modern palette (matches the app's brand)
  const BG = [8,15,13], BG_SECTION = [17,31,27], INK = [240,241,237],
        INK_DIM = [178,186,180], GREEN = [95,190,139], GREEN_DEEP = [58,140,102],
        LINE_COL = [48,68,60];

  function fillPageBg(){
    doc.setFillColor(BG[0],BG[1],BG[2]);
    doc.rect(0, 0, pageW, 297, 'F');
  }
  fillPageBg();

  function checkPage(needed){
    if(y + needed > pageBottom){
      doc.addPage();
      fillPageBg();
      doc.setFillColor(GREEN[0],GREEN[1],GREEN[2]);
      doc.rect(0, 0, pageW, 2, 'F');
      y = 22;
    }
  }
  function addTitle(text){
    checkPage(19);
    doc.setFillColor(GREEN_DEEP[0],GREEN_DEEP[1],GREEN_DEEP[2]);
    doc.rect(marginX-3, y-5, 3.2, 6.4, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(16.5); doc.setTextColor(GREEN[0],GREEN[1],GREEN[2]);
    doc.text(text, marginX+4.5, y); y += 7.5;
    doc.setDrawColor(LINE_COL[0],LINE_COL[1],LINE_COL[2]); doc.setLineWidth(0.3);
    doc.line(marginX, y, pageW-marginX, y); y += 8.5;
  }
  function addSection(text){
    checkPage(13);
    doc.setFillColor(BG_SECTION[0],BG_SECTION[1],BG_SECTION[2]);
    doc.rect(marginX-3, y-5.5, pageW-marginX*2+6, 10, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(12.5); doc.setTextColor(INK[0],INK[1],INK[2]);
    doc.text(text, marginX, y); y += 9;
  }
  function addLine(text, opts={}){
    doc.setFont('helvetica', opts.bold?'bold':'normal'); doc.setFontSize(opts.size||11.5);
    const c = opts.color || INK_DIM;
    doc.setTextColor(c[0], c[1], c[2]);
    const lines = doc.splitTextToSize(text, pageW-marginX*2);
    lines.forEach(l=>{ checkPage(6.5); doc.text(l, marginX, y); y+=6; });
  }

    checkPage(15);
    const cleanName = exerciseName.replace(/\s*\(foco extra\)\s*$/, '').trim();
    const videoUrl = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(cleanName + ' execução correta');

      checkPage(7); 
      doc.text(l, marginX, y); 
      
      // Adiciona link [assistir] na FRENTE da primeira linha

        const linkText = '[assistir]';
        const linkX = pageW - marginX - 18;
        doc.setFont('helvetica','normal'); 
        doc.setFontSize(8);

        doc.setFont('helvetica','normal'); 
        doc.setFontSize(11.5); 
        doc.setTextColor(INK[0],INK[1],INK[2]);
      }
      y+=6;

  meals.forEach(m=>{
    addSection(`${m.name}  (~${m.kcal} kcal)`);
    addLine('Opção 1', {bold:true, size:10.5, color:GREEN});
    m.opcao1.forEach(it=> addLine(`•  ${it.food} — ${formatPortion(it.food, it.grams)}`));
    y += 3;
    addLine('Opção 2', {bold:true, size:10.5, color:GREEN});
    m.opcao2.forEach(it=> addLine(`•  ${it.food} — ${formatPortion(it.food, it.grams)}`));
    y += 5;
  });

  y += 4;
  addTitle('Substituições');
  addLine('Se algum alimento acima não for do seu gosto, troque por outro da mesma lista abaixo — a quantidade já é equivalente ao que você precisa em uma refeição.', {size:10, color:INK_DIM});
  y += 2;
  const subs = getSubstitutions(a);
  addSection(`Fontes de proteína  (equivalentes a ~${subs.refProtein}g de proteína)`);
  subs.proteinList.forEach(s=> addLine(`•  ${s.food} — ${s.portion}`));
  y += 3;
  addSection(`Fontes de carboidrato  (equivalentes a ~${subs.refCarb}g de carboidrato)`);
  subs.carbList.forEach(s=> addLine(`•  ${s.food} — ${s.portion}`));
  y += 3;
  addSection('Frutas');
  subs.fruitList.forEach(s=> addLine(`•  ${s.food} — ${s.portion}`));
  y += 3;
  addSection('Vegetais');
  subs.vegList.forEach(s=> addLine(`•  ${s.food} — ${s.portion}`));
  y += 3;
  addLine('Dica: use as opções de café da manhã (pão, ovo, aveia, tapioca, whey, queijo, iogurte, frutas) nas refeições mais leves, e as opções de almoço/jantar (frango, carne, peixe, arroz, feijão, batata, macarrão, vegetais) nas refeições principais.', {size:10, color:INK_DIM});

  y += 6;
  addTitle('Suplementação Sugerida');
  getSupplementation(a).forEach(s=>{
    addSection(s.nome);
    addLine(`Dose: ${s.dose}`);
    addLine(`Quando: ${s.quando}`, {color:INK_DIM});
    y += 2;
  });
  y += 6;

  addTitle('Seu Treino Sugerido');
  addLine('Orientação geral: a cada semana, tente aumentar um pouco a carga ou fazer mais uma repetição em cada exercício, sempre que a execução permitir com boa técnica. Essa progressão gradual é o que realmente gera resultado ao longo do tempo.', {size:10, color:INK_DIM});
  y += 2;
  addLine(`Local: ${a.local}   ·   Frequência: ${a.dias} · ${a.tempo}   ·   Nível: ${a.nivel}`);
  addLine(`Divisão: ${a.divisao}`, {bold:true, size:12, color:GREEN});
  addLine(`Estilo: ${a.estilo}   ·   Foco extra: ${a.foco}`);
  const workout = generateWorkoutPlan(a);
  addLine(`Esquema padrão: ${workout.scheme.series} séries de ${workout.scheme.reps} repetições  ·  descanso ${workout.scheme.descanso}`, {bold:true, size:12, color:GREEN});
  addLine(`Método: ${workout.scheme.metodo}`, {color:INK_DIM});
  y += 3;
  workout.days.forEach(d=>{
    addSection(d.label);
    d.exercises.forEach(ex=>{
      const methodTxt = ex.metodo ? `  (${ex.metodo.nome}: ${ex.metodo.explica})` : '';
      addExerciseWithVideo(`•  ${ex.exercicio}  —  ${workout.scheme.series}x${workout.scheme.reps}${methodTxt}`, ex.exercicio);
    });
    y += 3;
  });

  y += 6;
  addTitle('Cardio Sugerido');
  const cardio = getCardioPlan(a);
  addLine(`Tipo: ${cardio.tipo}`);
  addLine(`Duração: ${cardio.duracao}   ·   Frequência: ${cardio.frequencia}`, {bold:true, size:12, color:GREEN});
  addLine(`Ritmo: ${cardio.ritmo}`);
  addLine(`Quando fazer: ${cardio.quando}`, {color:INK_DIM});

  y += 8;
  checkPage(30);
  doc.setFillColor(BG_SECTION[0],BG_SECTION[1],BG_SECTION[2]);
  doc.rect(marginX-3, y-6.5, pageW-marginX*2+6, 36, 'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(11.5); doc.setTextColor(GREEN[0],GREEN[1],GREEN[2]);
  doc.text('Validade deste protocolo', marginX, y); y += 6.5;
  doc.setFont('helvetica','normal'); doc.setFontSize(10.5); doc.setTextColor(INK_DIM[0],INK_DIM[1],INK_DIM[2]);
  const closing = doc.splitTextToSize('Este protocolo tem validade de 6 semanas. Após esse período, para manter os resultados e evoluir, você deverá renovar seu planejamento com o seu coach. A renovação inclui novas medidas, ajustes de macros e progressão de treino. Converse com seu coach sobre as opções de renovação e investimento no seu sucesso!', pageW-marginX*2-6);
  closing.forEach(l=>{ doc.text(l, marginX, y); y+=5.4; });
  
  y += 8;
  doc.setFont('helvetica','italic'); doc.setFontSize(11.5); doc.setTextColor(GREEN[0],GREEN[1],GREEN[2]);
  doc.text('Protocolo desenvolvido por', marginX, y); y += 6;
  doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.setTextColor(INK[0],INK[1],INK[2]);
  doc.text('Clóves — Personal Trainer e Nutricionista', marginX, y);

  const safeName = a.nome.toLowerCase().replace(/[^a-z0-9]+/g,'-');
  doc.save(`plano-sculptx-${safeName}.pdf`);
}

function gramsForMacro(food, macroKey, targetG){
  const per100 = NUTRI[food][macroKey];
  if(!per100 || per100 <= 0) return 100;
  const grams = (targetG / per100) * 100;
  let rounded = Math.max(20, Math.round(grams/5)*5);
  if(MAX_GRAMS[food]) rounded = Math.min(rounded, MAX_GRAMS[food]);
  return rounded;
}

function generateMealPlan(answers){
  const macros = calcMacros(answers);
  const target = calcTarget(answers);
  const nMeals = parseInt(answers.refeicoes, 10);
  const templates = MEAL_TEMPLATES[nMeals] || MEAL_TEMPLATES[4];
  const foods = pickFoods(answers);
  let idx = {};

  const pickPrimary = (cat, ctx)=>{
    let primary = foods[cat].filter(f => FOOD_CONTEXT[f] && FOOD_CONTEXT[f].includes(ctx));
    if(!primary.length) primary = DEFAULT_FOODS[cat].filter(f => FOOD_CONTEXT[f] && FOOD_CONTEXT[f].includes(ctx));
    if(!primary.length) primary = foods[cat];
    const key = cat+'_'+ctx;
    if(idx[key] === undefined) idx[key] = 0;
    const f = primary[idx[key] % primary.length];
    idx[key]++;
    return f;
  };
  const pickAlternative = (cat, ctx, avoid)=>{
    let pool = DEFAULT_FOODS[cat].filter(f => FOOD_CONTEXT[f] && FOOD_CONTEXT[f].includes(ctx) && f !== avoid);
    if(!pool.length) pool = DEFAULT_FOODS[cat].filter(f => FOOD_CONTEXT[f] && FOOD_CONTEXT[f].includes(ctx));
    if(!pool.length) pool = [avoid];
    const key = 'alt_'+cat+'_'+ctx;
    if(idx[key] === undefined) idx[key] = 0;
    const f = pool[idx[key] % pool.length];
    idx[key]++;
    return f;
  };

  const buildFoodItems = (cat, ctx, macroKey, macroTarget, primaryFood)=>{
    const g1 = gramsForMacro(primaryFood, macroKey, macroTarget);
    const items = [{food:primaryFood, grams:g1}];
    // NÃO ADICIONA SEGUNDO ALIMENTO - UM POR REFEIÇÃO!
    return items;
  };

  const buildMealOptions = (t)=>{
    const mProt = macros.proteinG * t.w;
    const mCarb = macros.carbG * t.w;
    const items1 = [], items2 = [];
    const dicas1 = [], dicas2 = [];
    t.slots.forEach(slot=>{
      if(slot === 'prot' || slot === 'carb'){
        const cat = slot === 'prot' ? 'prot' : 'carb';
        const macroKey = slot === 'prot' ? 'p' : 'c';
        const macroTarget = slot === 'prot' ? mProt*0.85 : mCarb*0.8;
        const f1 = pickPrimary(cat, t.ctx);
        const f2 = pickAlternative(cat, t.ctx, f1);
        items1.push(...buildFoodItems(cat, t.ctx, macroKey, macroTarget, f1));
        items2.push(...buildFoodItems(cat, t.ctx, macroKey, macroTarget, f2));
        
        // Adiciona dicas de preparo
        if(f1.includes('Ovo')) dicas1.push('Faça ovos mexidos ou cozidos — ricos em proteína');
        if(f1.includes('Pão')) dicas1.push('Prefira pão tostado ou alimento junto ao pão (proteína + pão)');
        if(f1.includes('Frango') || f1.includes('Alcatra')) dicas1.push('Grelhe sem adicionar óleo — use temperos variados');
        
        if(f2.includes('Ovo')) dicas2.push('Faça ovos mexidos ou cozidos — ricos em proteína');
        if(f2.includes('Pão')) dicas2.push('Prefira pão tostado ou alimento junto ao pão (proteína + pão)');
        if(f2.includes('Frango') || f2.includes('Alcatra')) dicas2.push('Grelhe sem adicionar óleo — use temperos variados');
      } else if(slot === 'fruta'){
        const f1 = pickPrimary('fruta', t.ctx);
        const f2 = pickAlternative('fruta', t.ctx, f1);
        items1.push({food:f1, grams:100});
        items2.push({food:f2, grams:100});
        if(!dicas1.some(d=>d.includes('fruta'))) dicas1.push('Fruta fresca — melhor opção pós-treino ou lanches');
        if(!dicas2.some(d=>d.includes('fruta'))) dicas2.push('Fruta fresca — melhor opção pós-treino ou lanches');
      } else if(slot === 'veg'){
        const f1 = pickPrimary('veg', t.ctx);
        const f2 = pickAlternative('veg', t.ctx, f1);
        items1.push({food:f1, grams:120});
        items2.push({food:f2, grams:120});
      }
    });
    if(t.slots.includes('veg')){
      const gf1 = pickPrimary('gord', t.ctx);
      const gf2 = pickAlternative('gord', t.ctx, gf1);
      items1.push({food:gf1, grams: gf1.includes('Azeite') ? 10 : 15});
      items2.push({food:gf2, grams: gf2.includes('Azeite') ? 10 : 15});
    }
    return {items1, items2, dicas1, dicas2};
  };

  const meals = templates.map(t=>{
    const mKcal = target * t.w;
    const {items1, items2, dicas1, dicas2} = buildMealOptions(t);
    return {name:t.name, kcal: Math.round(mKcal), opcao1: items1, opcao2: items2, dica1: dicas1[0], dica2: dicas2[0]};
  });
  return meals;
}

const SPOON_FOODS = {
  'Azeite extra virgem': {peso:10, label:'colher de sopa'},
  'Pasta de amendoim': {peso:15, label:'colher de sopa'},
};
function formatPortion(food, grams){
  if(UNIT_FOODS[food]){
    const u = UNIT_FOODS[food];
    const qty = Math.max(1, Math.round(grams / u.peso));
    const label = qty === 1 ? u.singular : u.plural;
    const realGrams = qty * u.peso;
    return `${qty} ${label} (~${realGrams}g)`;
  }
  if(SPOON_FOODS[food]){
    const s = SPOON_FOODS[food];
    const qty = Math.max(1, Math.round(grams / s.peso));
    const realGrams = qty * s.peso;
    return `${qty} ${s.label}${qty>1?'s':''} (~${realGrams}g)`;
  }
  return `${grams}g`;
}

function getSubstitutions(answers){
  const nMeals = parseInt(answers.refeicoes, 10) || 4;
  const macros = calcMacros(answers);
  const refProtein = Math.round(macros.proteinG / nMeals);
  const refCarb = Math.round(macros.carbG / nMeals);

  const proteinFoods = ['Peito de frango grelhado','Alcatra grelhada','Tilápia grelhada','Atum natural (lata)','Ovo inteiro','Whey protein','Queijo minas frescal light','Iogurte natural desnatado','Patinho moído','Lombo de porco','Sobrecoxa de frango sem pele','Queijo cottage','Proteína de soja texturizada','Músculo bovino','Filé suíno','Sardinha','Salmão','Peru moído','Queijo ricota','Tofu'];
  const carbFoods = ['Arroz branco cozido','Feijão carioca cozido','Batata doce cozida','Batata inglesa cozida','Macarrão cozido','Pão francês','Pão de forma tradicional','Pão de forma integral','Aveia em flocos','Tapioca pronta','Cuscuz cozido','Arroz integral','Mandioca','Mandioquinha','Quinoa','Grão-de-bico','Cará','Inhame','Lentilha','Milho verde'];
  const fruitFoods = ['Banana','Maçã','Laranja','Mamão papaya','Morango','Uva','Manga','Melancia','Abacaxi','Melão','Kiwi','Tangerina','Goiaba','Pêra','Maracujá','Pêssego','Ameixa','Cereja','Figo'];
  const vegFoods = ['Alface','Tomate','Brócolis','Cenoura crua','Abobrinha cozida','Pepino','Couve-flor cozida','Beterraba cozida','Espinafre','Vagem','Repolho','Berinjela','Chuchu','Rúcula','Aspargos','Couve-manteiga','Acelga','Rabanete'];

  const proteinList = proteinFoods.map(f=>{
    const g = gramsForMacro(f, 'p', refProtein);
    return {food:f, portion:formatPortion(f, g)};
  });
  const carbList = carbFoods.map(f=>{
    const g = gramsForMacro(f, 'c', refCarb);
    return {food:f, portion:formatPortion(f, g)};
  });
  const fruitList = fruitFoods.map(f=> ({food:f, portion:formatPortion(f, 100)}));
  const vegList = vegFoods.map(f=> ({food:f, portion:formatPortion(f, 120)}));

  return {refProtein, refCarb, proteinList, carbList, fruitList, vegList};
}

    });
    html += `</div>`;
    html += whyHtml(step);
    footerBtn.style.display = 'none';
  } else if(step.type === 'confirm'){
    const o = step.optionFn(answers);
    html += `<div class="opt-list">
      <div class="row-card rec-card" data-value="${o.v}">
        <div class="badge">Recomendada</div>
        <div class="rt">${o.v}</div>
        <div class="rs">${o.sub}</div>
      </div>
    </div>`;
    html += whyHtml(step);
    footerBtn.style.display = 'none';
  } else if(step.type === 'multi'){
    const picked = answers[step.key] || [];
    html += `<div class="opt-list">`;
    step.foods.forEach(f=>{
      const sel = picked.includes(f.v);
      html += `<div class="row-card multi ${sel?'selected':''}" data-value="${f.v}">
        <span class="emoji">${f.e}</span>
        <span class="rt">${f.v}</span>
        <span class="check">✓</span>
      </div>`;
    });
    html += `</div>`;
    html += `<p style="font-size:12px; color:var(--ink-faint); margin-top:16px;">Marque o que você gosta, ou siga sem marcar: o método escolhe pra você.</p>`;
    html += whyHtml(step);
    footerBtn.style.display = 'block';
    continueBtn.textContent = step.ctaLabel || 'Próxima categoria';
    continueBtn.disabled = false;
  } else if(step.type === 'number'){
    const val = answers[step.key] || '';
    html += `<input type="number" id="numInput" placeholder="${step.placeholder}" value="${val}" inputmode="numeric">`;
    html += whyHtml(step);
    footerBtn.style.display = 'block';
    continueBtn.textContent = 'Continuar';
    continueBtn.disabled = !val;
  }

  main.innerHTML = html;
  attachHandlers(step);
}

function whyHtml(step){
  if(!step.why) return '';
  return `<div class="why-box"><div class="wt">Por que isso importa</div><p>${step.why}</p></div>`;
}

function attachHandlers(step){
  const continueBtn = document.getElementById('continueBtn');

  if(step.type === 'list' || step.type === 'dynamiclist' || step.type === 'confirm'){
    document.querySelectorAll('[data-value]').forEach(el=>{
      el.addEventListener('click', ()=>{
        answers[step.key] = el.dataset.value;
        document.querySelectorAll('[data-value]').forEach(x=>x.classList.remove('selected'));
        el.classList.add('selected');
        setTimeout(()=> goNext(), 260);
      });
    });
  } else if(step.type === 'multi'){
    document.querySelectorAll('[data-value]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const v = el.dataset.value;
        if(!answers[step.key]) answers[step.key] = [];
        const arr = answers[step.key];
        const i = arr.indexOf(v);
        if(i>-1){ arr.splice(i,1); el.classList.remove('selected'); }
        else { arr.push(v); el.classList.add('selected'); }
      });
    });
    continueBtn.onclick = goNext;
  } else if(step.type === 'number'){
    const input = document.getElementById('numInput');
    input.focus();
    input.addEventListener('input', ()=>{
      answers[step.key] = input.value ? parseFloat(input.value) : '';
      continueBtn.disabled = !input.value;
    });
    continueBtn.onclick = goNext;
  }
}

function goNext(){ current++; window.scrollTo(0,0); render(); }
function goBack(){ if(current<=0) return; current--; window.scrollTo(0,0); render(); }
document.getElementById('backBtn').addEventListener('click', goBack);

function buildWhatsAppMessage(target, tdee, macros){
  const foodLine = (key)=> (answers[key] && answers[key].length) ? answers[key].join(', ') : 'método escolhe';
  const lines = [];
  lines.push('📊 *Método SculptX — Confirmação*');
  lines.push('');
  lines.push('Confirmo meu planejamento de 1 mês gratuito! 💪');
  lines.push('');
  lines.push(`*Nome:* ${answers.nome}`);
  lines.push(`*Objetivo:* ${answers.objetivo}`);
  lines.push(`*Sexo:* ${answers.sexo}  *Idade:* ${answers.idade}`);
  lines.push(`*Peso:* ${answers.peso}kg  *Altura:* ${answers.altura}cm`);
  lines.push(`*Rotina:* ${answers.rotina}`);
  lines.push(`*Gasto total (TDEE):* ${fmt(tdee)} kcal/dia`);
  lines.push(`*Alvo de dieta:* ${fmt(target)} kcal/dia`);
  lines.push(`*Refeições:* ${answers.refeicoes}`);
  lines.push(`*Macros:* ${macros.proteinG}g proteína · ${macros.carbG}g carbo · ${macros.fatG}g gordura`);
  lines.push('');
  lines.push(`*Proteínas preferidas:* ${foodLine('proteinas')}`);
  lines.push(`*Carboidratos preferidos:* ${foodLine('carboidratos')}`);
  lines.push(`*Frutas preferidas:* ${foodLine('frutas')}`);
  lines.push(`*Gorduras preferidas:* ${foodLine('gorduras')}`);
  lines.push(`*Vegetais preferidos:* ${foodLine('vegetais')}`);
  lines.push('');
  lines.push(`*Local de treino:* ${answers.local}`);
  lines.push(`*Frequência:* ${answers.dias} · ${answers.tempo}`);
  lines.push(`*Nível:* ${answers.nivel}`);
  lines.push(`*Divisão recomendada:* ${answers.divisao}`);
  lines.push(`*Foco muscular:* ${answers.foco}`);
  lines.push(`*Estilo:* ${answers.estilo}`);
  lines.push('');
  lines.push('Aguardo seu retorno pra começar! 💪');
  return encodeURIComponent(lines.join('\n'));
}
